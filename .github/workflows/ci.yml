name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  railway-readiness:
    name: Railway readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and rendering tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Smoke test Railway start command
        run: |
          PORT=4173 npm run start > /tmp/akp-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/healthz; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:4173/ | grep -q "AKP"
